<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD Kolejní - Živý Stream</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; }
        #status {
            position: absolute; top: 10px; left: 50px; right: 10px; z-index: 1000;
            background: rgba(255,255,255,0.95); padding: 8px 12px;
            border-radius: 6px; border: 2px solid #333; font-size: 13px; font-weight: bold;
        }
        .bus-icon {
            background: #0056b3; color: #fff; border-radius: 4px; padding: 2px 5px;
            font-size: 11px; font-weight: bold; border: 1px solid #fff; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="status">Připojuji se k živému streamu Brna...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const LAT = 49.2316;
        const LON = 16.5745;
        const RADIUS = 1500; // 1,5 km kolem Kolejní

        const map = L.map('map', {
            center: [LAT, LON], zoom: 15, minZoom: 13, maxZoom: 18,
            maxBounds: [[49.19, 16.50], [49.27, 16.65]]
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        L.circleMarker([LAT, LON], { color: '#d9534f', fillOpacity: 1, radius: 7 })
            .addTo(map).bindPopup('<b>Zastávka Kolejní</b>');
        L.circle([LAT, LON], { color: '#d9534f', weight: 1, fillOpacity: 0.05, radius: RADIUS }).addTo(map);

        const statusEl = document.getElementById('status');
        const markers = {}; // Uchovává aktivní vozy podle jejich ID

        // Výpočet obdélníku (BBOX) kolem Kolejní, aby server posílal jen blízká vozidla
        const latD = RADIUS / 111320;
        const lonD = RADIUS / (111320 * Math.cos(LAT * Math.PI / 180));
        const filterEnvelope = {
            xmin: LON - lonD, ymin: LAT - latD,
            xmax: LON + lonD, ymax: LAT + latD,
            spatialReference: { wkid: 4326 }
        };

        let ws;
        function connectStream() {
            // Oficiální WebSocket StreamServer města Brna (KORDIS)
            const wsUrl = 'wss://gis.brno.cz/ags4/rest/services/stream_kordis_26/StreamServer/subscribe?outSR=4326';
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusEl.innerText = '🟢 Připojeno – čekám na pohyb vozidel v okolí...';
                statusEl.style.color = '#198754';
                // Požádáme server, aby filtroval data jen pro okolí Kolejní
                ws.send(JSON.stringify({ filter: { geometry: filterEnvelope } }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (!data.geometry) return;

                    const lon = data.geometry.x;
                    const lat = data.geometry.y;
                    if (!lat || !lon) return;

                    const dist = map.distance([LAT, LON], [lat, lon]);
                    const props = data.attributes || {};
                    const id = props.ID || props.VehicleId || props.id || `${ props.LineName }_${ props.Course }`;

                    if (dist <= RADIUS) {
                        const line = props.LineName || props.line_name || props.LineId || '?';
                        const delay = props.Delay ?? props.delay ?? 0;
                        const finalStop = props.FinalStopName || '';

                        const icon = L.divIcon({
                            className: '',
                            html: `<div class="bus-icon">${line}</div>`,
                            iconSize: [28, 18], iconAnchor: [14, 9]
                        });

                        const popup = `<b>Linka ${line}</b><br>Směr: ${finalStop}<br>Zpoždění: ${delay} min`;

                        if (markers[id]) {
                            markers[id].setLatLng([lat, lon]).setIcon(icon).setPopupContent(popup);
                        } else {
                            markers[id] = L.marker([lat, lon], { icon }).addTo(map).bindPopup(popup);
                        }
                        statusEl.innerText = `🟢 Živě: ${Object.keys(markers).length} vozů v okolí Kolejní`;
                    } else if (markers[id]) {
                        // Pokud vůz vyjel z okruhu 1,5 km, smažeme ho z mapy
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                } catch (e) {}
            };

            ws.onerror = () => {
                statusEl.innerText = '❌ Chyba WebSocket spojení se serverem gis.brno.cz';
                statusEl.style.color = '#b00000';
            };

            ws.onclose = () => {
                statusEl.innerText = '⏳ Spojení přerušeno, zkusím znovu za 5s...';
                statusEl.style.color = '#d9534f';
                setTimeout(connectStream, 5000);
            };
        }

        connectStream();

        // Úspora dat: při minimalizaci prohlížeče odpojí stream
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'hidden' && ws) {
                ws.close();
            } else if (document.visibilityState === 'visible' && (!ws || ws.readyState === WebSocket.CLOSED)) {
                connectStream();
            }
        });
    </script>
</body>
</html>

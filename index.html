<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MHD Brno - Kolejní</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { width: 100vw; height: 100vh; }
        /* Panel pro zobrazení stavu na mobilu */
        #status { 
            position: absolute; 
            top: 10px; 
            left: 50px; 
            z-index: 1000; 
            background: white; 
            padding: 8px 12px; 
            border: 2px solid rgba(0,0,0,0.2); 
            border-radius: 4px; 
            font-family: sans-serif;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="status">Čekám na data...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const LAT = 49.2316;
        const LON = 16.5745;
        
        const map = L.map('map', {
            center: [LAT, LON],
            zoom: 14,
            minZoom: 13,
            maxZoom: 18,
            maxBounds: [[49.20, 16.50], [49.26, 16.65]]
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.circleMarker([LAT, LON], { color: 'red', radius: 8 }).addTo(map).bindPopup('<b>Zastávka Kolejní</b>');

        const vehiclesLayer = L.layerGroup().addTo(map);
        const statusDiv = document.getElementById('status');

        async function fetchVehicles() {
            if (document.visibilityState === 'hidden') return;
            
            statusDiv.innerText = 'Stahuji data...';
            statusDiv.style.color = 'black';

            const baseUrl = 'https://services6.arcgis.com/fUWVlHWZNxUvTUh8/arcgis/rest/services/Polohy_vozidel_DPMB/FeatureServer/0/query';
            
            const params = new URLSearchParams({
                where: '1=1', // Oprava: Vynucení dotazu pro ArcGIS server
                f: 'geojson',
                geometryType: 'esriGeometryPoint',
                geometry: `${LON},${LAT}`,
                spatialRel: 'esriSpatialRelIntersects',
                distance: '2000', // Zvětšeno na 2 km pro testovací účely
                units: 'esriSRUnit_Meter',
                inSR: '4326',
                outSR: '4326',
                outFields: '*'
            });

            try {
                const response = await fetch(`${baseUrl}?${params.toString()}`);
                
                if (!response.ok) {
                    throw new Error(`Chyba sítě: ${response.status}`);
                }
                
                const data = await response.json();

                // Pokud ArcGIS vrátí chybovou hlášku v JSON struktuře
                if (data.error) {
                    throw new Error(data.error.message);
                }

                vehiclesLayer.clearLayers();

                if (data.features && data.features.length > 0) {
                    statusDiv.innerText = `Aktualizováno (vozidel: ${data.features.length})`;
                    statusDiv.style.color = 'green';
                    
                    data.features.forEach(vehicle => {
                        const coords = vehicle.geometry.coordinates;
                        const props = vehicle.properties;
                        
                        const marker = L.circleMarker([coords[1], coords[0]], {
                            color: 'blue',
                            fillOpacity: 0.8,
                            radius: 6
                        });
                        
                        let popupText = `<b>Linka:</b> ${props.LineName || props.LineId || 'Neznámá'}<br>`;
                        if (props.Delay !== undefined) popupText += `<b>Zpoždění:</b> ${props.Delay} min`;
                        
                        marker.bindPopup(popupText);
                        vehiclesLayer.addLayer(marker);
                    });
                } else {
                    statusDiv.innerText = 'Žádné vozy v okruhu 2 km';
                    statusDiv.style.color = 'orange';
                }
            } catch (err) {
                statusDiv.innerText = 'Chyba: ' + err.message;
                statusDiv.style.color = 'red';
            }
        }

        fetchVehicles();
        setInterval(fetchVehicles, 20000);

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'visible') {
                fetchVehicles();
            }
        });
    </script>
</body>
</html>
